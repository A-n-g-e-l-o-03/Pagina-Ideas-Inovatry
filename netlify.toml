[build]
  publish = "Ecosistema de Idea-MVP-Sistema"
  command = "echo ''No build - static site''"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback - history API
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
