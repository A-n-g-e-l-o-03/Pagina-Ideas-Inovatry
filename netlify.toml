[build]
  publish = "Ecosistema de Idea-MVP-Sistema"
  command = "echo ''No build - static site''"

[build.environment]
  NODE_VERSION = "22"
  ECOSISTEMA_NEW_ENGINE = "true"
  ECOSISTEMA_MD_GENERATION = "true"
  ECOSISTEMA_FILE_UPLOAD = "true"
  ECOSISTEMA_HIGH_CONTRAST = "true"
  ECOSISTEMA_DEMO_UNLOCK_ALL = "true"

# SPA fallback - history API
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"